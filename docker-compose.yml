services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/config/.env
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - ./backend/config:/app/config
      - ./backend/knowledge:/app/knowledge
      - ./backend/workspace:/app/workspace
      - ./backend/skills:/app/skills
      - ./backend/memory_module_v1:/app/memory_module_v1
      - ./backend/sessions:/app/sessions
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:7788:7788"
